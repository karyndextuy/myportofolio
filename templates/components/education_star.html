{% with starrers=edu.starred_by.all %}
    <form method="post" action="{% url 'main:toggle_star_education' edu.id %}" class="star-form">
        {% csrf_token %}
        <button type="submit"
                class="button button-star{% if user in starrers %} is-starred{% endif %}"
                aria-pressed="{% if user in starrers %}true{% else %}false{% endif %}"
                title="{% if starrers %}Dibintangi oleh {{ starrers|join:', ' }}{% else %}Jadilah yang pertama memberi star{% endif %}">
            <span aria-hidden="true">★</span>
            {% if user in starrers %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ starrers|length }}</span>
        </button>
    </form>
{% endwith %}
