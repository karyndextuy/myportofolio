{% extends "base.html" %}
{% block meta %}
    <title>{{ name }} - Portofolio</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/image.png" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/karyndextuy" class="social-link" target="_blank" rel="noopener">GitHub</a>
                        <a href="https://www.linkedin.com/in/karyn-isabelle-dexter-82b7a9380/" class="social-link" target="_blank" rel="noopener">LinkedIn</a>
                        <a href="mailto:karynisabelledexter@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
