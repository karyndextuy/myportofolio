<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ name }} - Portofolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container">
            <a href="{% url 'main:show_main' %}" class="brand">{{ name }}</a>
            <div class="header-controls">
                <nav>
                    <a href="{% url 'main:show_main' %}">Profile</a>
                    <a href="{% url 'main:show_education' %}">Education</a>
                    <a href="{% url 'main:show_experience' %}">Experience</a>
                    <a href="{% url 'main:show_hobbies' %}">Hobbies</a>
                </nav>
                <div class="theme-toggle-wrap">
                    <input type="checkbox" id="theme-toggle" class="theme-toggle-input">
                    <label for="theme-toggle" class="theme-toggle-label" aria-label="Toggle dark mode">
                        <span class="theme-toggle-icon" aria-hidden="true">&#9728;</span>
                        <span class="theme-toggle-ball"></span>
                        <span class="theme-toggle-icon" aria-hidden="true">&#9789;</span>
                    </label>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="hero" id="profile">
            <div class="container hero-grid">
                <div class="hero-identity">
                    <p class="hero-kicker">Computer Science &middot; Universitas Indonesia</p>
                    <h1>{{ name }}</h1>
                </div>
                <div class="hero-photo">
                    <div class="photo-block"></div>
                    <img class="avatar" src="/static/img/image.png" alt="Photo of {{ name }}">
                </div>
                <div class="hero-details">
                    <p class="bio">{{ bio }}</p>
                    <dl class="meta-list">
                        <div class="meta-row">
                            <dt>NPM</dt>
                            <dd>{{ npm }}</dd>
                        </div>
                        <div class="meta-row">
                            <dt>Program</dt>
                            <dd>{{ study_program }}</dd>
                        </div>
                    </dl>
                    <div class="social-links">
                        <a href="https://github.com/karyndextuy" class="social-link" target="_blank" rel="noopener">GitHub</a>
                        <a href="https://www.linkedin.com/in/karyn-isabelle-dexter-82b7a9380/" class="social-link" target="_blank" rel="noopener">LinkedIn</a>
                        <a href="mailto:karynisabelledexter@gmail.com" class="social-link">Email</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>&copy; 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas Indonesia.</p>
        </div>
    </footer>
</body>
</html>
